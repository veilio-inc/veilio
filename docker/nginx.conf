# Reference config — the container no longer uses this file.
#
# The image dropped nginx for a static binary on an empty base (see
# docker/serve.go), which took it from 77 MB to 10 MB. This is kept, and kept
# working, because the README points self-hosters here: serving the release
# tarball behind an nginx you already run is a supported path, and the SPA
# fallback below is the one thing people get wrong.
#
# serve.go implements exactly these rules, security headers included. If you
# change one, change both.
#
# A note on the repetition below, because it looks like a mistake and is not:
# nginx's add_header does not merge with an inherited set — a single add_header
# inside a location DISCARDS every add_header from the server block. Both
# locations here set Cache-Control, so without repeating them the security
# headers would silently vanish on exactly the assets that matter. That failure
# is invisible until someone reads the response headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is meant to make no external request whatsoever — the fonts are
    # vendored for precisely this reason (ROADMAP A4) — so the policy can be
    # 'self' throughout. 'unsafe-inline' in style-src is required by CodeMirror,
    # which injects its theme as an inline style; script-src stays strict, which
    # is the directive that matters for exfiltration.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html never cached
    location ~* \.(js|css|woff2?|ttf|ico|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
