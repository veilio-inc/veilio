# Reference config — the container no longer uses this file.
#
# The image dropped nginx for a static binary on an empty base (see
# docker/serve.go), which took it from 77 MB to 10 MB. This is kept, and kept
# working, because the README points self-hosters here: serving the release
# tarball behind an nginx you already run is a supported path, and the SPA
# fallback below is the one thing people get wrong.
#
# serve.go implements exactly these four rules. If you change one, change both.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html never cached
    location ~* \.(js|css|woff2?|ttf|ico|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
