<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Veilio">
  <title>Veilio</title>
  <!--
    The Veilio mark: an editor window with the identifier on it redacted — the
    product in one frame, rather than the abstract bar this file used to hold.
    Shared with the veilio.dev placeholder page so the tab icon, the app nav and
    the marketing site are all the same drawing.

    Gradient ids are namespaced because this file also gets inlined; a bare
    "tile"/"coral" would collide with whatever else is on the page.
  -->
  <defs>
    <linearGradient id="veilio-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#322a25" />
      <stop offset="1" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="veilio-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98968" />
      <stop offset="1" stop-color="#b8633f" />
    </linearGradient>
  </defs>

  <!-- full-bleed rounded app tile (warm stone, matches the app bg) -->
  <rect width="100" height="100" rx="23" fill="url(#veilio-tile)" />

  <!-- editor / console window -->
  <rect x="19" y="25" width="62" height="50" rx="11" fill="#28211e" stroke="#4a4240" stroke-width="2.5" />

  <!-- title-bar dots (one accent) -->
  <circle cx="29" cy="35" r="3" fill="#cc785c" />
  <circle cx="39" cy="35" r="3" fill="#4a4240" />
  <circle cx="49" cy="35" r="3" fill="#4a4240" />

  <!-- the redacted identifier (hero) -->
  <rect x="29" y="49" width="40" height="9.5" rx="4.75" fill="url(#veilio-coral)" />

  <!-- a remaining line of code -->
  <rect x="29" y="63" width="27" height="7" rx="3.5" fill="#4a4240" />
</svg>
