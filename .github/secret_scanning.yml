# The credential detector cannot be tested without credential-shaped strings,
# so its fixtures trip secret scanners by design. Every value in the excluded
# file is synthetic and has never been valid: several are the vendors' own
# published examples (AWS's AKIAIOSFODNN7EXAMPLE / wJalrXUtnFEMIK7MDENGbPxRfiCY...,
# the jwt.io sample token), and the rest are alphabet or sequential filler.
#
# Excluded so that a real leaked credential is not buried under known-synthetic
# noise. This suppresses scanning *alerts*; it does not lift push protection,
# which is bypassed per-detection in the GitHub UI.
paths-ignore:
  - 'packages/engine/tests/secrets.test.ts'
