name: "Credential pattern"
description: A credential detector missed a real credential shape, or fired on something that isn't one.
labels: ["bug", "area: security", "area: engine"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real credential value, live or expired.** Describe the
        *shape* only — provider, prefix, length, character set — the same way
        you'd describe a regex, not an example that still works.

  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - Missed a real credential (false negative)
        - Fired on something that isn't a credential (false positive)
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider / credential type
      description: e.g. AWS access key, GCP service account key, Stripe secret key, JWT, private-key block, or "not one of the 33 detected today".
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Shape of the value (never the value itself)
      description: Prefix, length, character set, surrounding syntax — enough to write a detector or a test fixture without a real secret.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Surrounding code (reduced, values redacted by you)
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Engine version
    validations:
      required: true
