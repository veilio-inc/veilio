# Pinning by digest (ROADMAP E4) is only half an answer. An immutable pin that
# nobody moves is an unpatched dependency with better provenance — the risk
# changes shape rather than going away. This is the other half: Dependabot opens
# a PR when a pinned digest falls behind, and the PR carries the diff a human
# can actually review, which is the thing a floating tag never offered.
version: 2

updates:
  # GitHub Actions. These run with contents: write, packages: write and
  # id-token: write, so a compromised action is a compromised release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `ci:` releases nothing under the rules in .releaserc.js, which is
      # correct: bumping an action is not a change to the published engine.
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # Base images for the build and server stages. Nothing from these layers
  # reaches the final image — it is `scratch` plus the site and one static
  # binary — but they compile the binary and build the bundle, so they are
  # squarely in the supply chain.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build

  # The app's own dependencies. Security updates matter most here: this is the
  # only ecosystem whose contents are served to a browser.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # One PR per group rather than per package: a repo this size drowns
      # otherwise, and a drowned queue gets ignored, which defeats the point.
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # TypeScript 7 does not install here, and the blocker is not ours to fix.
      # @typescript-eslint/eslint-plugin peers on typescript ">=4.8.4 <6.1.0",
      # and 8.70.1 - the latest published release - still does. `npm ci` ends in
      # ERESOLVE before a single test runs.
      #
      # This is a ceiling on the whole group: one unresolvable member takes every
      # other update in the PR down with it, so holding TypeScript is what lets
      # the rest keep flowing. Lift it when typescript-eslint publishes a release
      # whose typescript peer admits 7, and take both in the same change.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The engine has zero runtime dependencies and that is enforced in CI, so this
  # only ever moves its devDependencies. Kept separate because its lockfile is
  # separate and semantic-release publishes from it.
  - package-ecosystem: npm
    directory: /packages/engine
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      engine-dev:
        patterns: ['*']
    ignore:
      # The same TypeScript ceiling as the root entry above, and it has to be
      # repeated: a dependabot `ignore` is scoped to the entry it sits in, not
      # to the repository. The root entry alone was added first, and Dependabot
      # raised typescript ^7.0.2 here within minutes (#54), failing exactly the
      # way the root group had.
      #
      # packages/engine is a workspace, so its manifest feeds the root tree -
      # @typescript-eslint/eslint-plugin peers on typescript ">=4.8.4 <6.1.0"
      # and `npm ci` ends in ERESOLVE before a single test runs, even though
      # nothing in this directory imports eslint.
      #
      # Lift both together, in the same change that raises typescript-eslint.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
