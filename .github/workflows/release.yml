name: Release

# Publishes the self-host artefacts: the GHCR container image, and — for
# version tags — a static bundle attached to a GitHub Release.
#
# This used to trigger on `v*.*.*` tags only. No such tag has ever existed:
# semantic-release owns tagging in this repo and its tagFormat is `engine-v*`,
# which does not match. The workflow therefore never ran, and the
# `ghcr.io/veilio-inc/veilio:latest` pull documented in the README returned
# "denied" because nothing had ever been pushed. Building the image on every
# push to main fixes that without waiting on a release process the app side
# does not have yet.
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Both are for build provenance (ROADMAP E9). `id-token` mints the OIDC
      # token that Sigstore binds the signature to; `attestations` lets the run
      # record the signed statement against the repository. Neither grants
      # anything else, and both are why every action here is pinned by digest.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static bundle
        run: npm run build
        env:
          VITE_VEILIO_CLOUD_URL: https://veilio.dev

      # metadata-action lowercases the image name itself, which is what the old
      # hand-rolled ${GITHUB_REPOSITORY,,} step existed to do.
      #
      # `latest` is applied unconditionally so the README's pull command works
      # off main; semver tags are added only on a `v*` tag push.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      # The runtime image is nginx plus static files, so its contents are
      # architecture-independent — but the manifest is not. Publishing both
      # arches means Apple Silicon self-hosters get a native pull instead of an
      # emulation warning. QEMU makes the arm64 leg slower; the build is a few
      # seconds natively, so that is affordable here.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit attestations, attached to the image index and readable with
          # `docker buildx imagetools inspect --format '{{json .Provenance}}'`.
          # `mode=max` records the full build definition — source, base image
          # digests, build args — rather than the minimal materials list, which
          # is what makes the image answerable to "what went into this?".
          # The SBOM is the companion question: "what is in this?".
          provenance: mode=max
          sbom: true
          build-args: |
            VITE_VEILIO_CLOUD_URL=https://veilio.dev

      # The BuildKit attestation above is unsigned metadata: it says what the
      # build claims, and anyone who can push to the registry can write it. This
      # step signs a SLSA provenance statement with a short-lived OIDC identity
      # through Sigstore, so the claim is bound to this repository, this
      # workflow file and this commit — verifiable by a stranger with
      #
      #   gh attestation verify oci://ghcr.io/veilio-inc/veilio:latest \
      #     --repo veilio-inc/veilio
      #
      # npm publishes already carry this through trusted publishing. The image
      # is the artefact most self-hosters actually run, so it was the weaker
      # link (ROADMAP E9).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Also stores the attestation alongside the image in GHCR, so it is
          # discoverable from the registry rather than only through the GitHub
          # API — self-hosters who never touch this repo can still check it.
          push-to-registry: true

      # Everything below is release-only. Main pushes stop at the image.
      - name: Package static bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "veilio-${TAG}.tar.gz" dist/
          echo "BUNDLE=veilio-${TAG}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.BUNDLE }}
          generate_release_notes: true
