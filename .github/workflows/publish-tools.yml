name: Publish CLI + MCP server

# Changesets owns @veilio-inc/cli and @veilio-inc/mcp. @veilio-inc/engine is
# owned by semantic-release (.releaserc.js, publish-engine.yml) and is named in
# .changeset/config.json `ignore`, so the two release tools cannot both claim a
# package. See .changeset/README.md for why the split exists.
#
# Two-step, and the second step is the one that publishes:
#
#   1. A push to main carrying changeset files opens (or updates) a "Version
#      Packages" pull request — version bumps and CHANGELOG entries, nothing
#      published.
#   2. Merging that PR runs this workflow again, finds no changesets left, and
#      runs `npm run release`.
#
# NOTHING PUBLISHES YET. Both manifests are still `private: true`, and
# `changeset publish` skips a private package without comment. Flipping that
# field is what arms this workflow, and it arms it for the NEXT Version Packages
# merge rather than on the commit that flips it — so read docs/PUBLISHING.md
# before flipping, not after.
#
# `paths` matters more here than it looks. changesets/action runs the `publish`
# command whenever NO changesets are pending — which is the state main is in
# almost always. Without a filter this workflow fires on every push to main,
# including a README edit or an engine commit, and each one parks against the
# `release` environment waiting for approval. An approval prompt that appears on
# every commit is one people learn to click through, which is worse than not
# having it.
#
# The filter cannot miss either of the two pushes that must run, because both
# touch .changeset/**: adding a changeset creates a file there, and merging the
# version PR deletes one (a deletion counts as a changed path). The version PR
# also rewrites packages/{cli,mcp}/package.json and CHANGELOG.md, so the second
# and third entries are the belt to that braces.
#
# packages/engine/** is deliberately NOT here. An engine release must not run
# the tools' publisher; that separation is the whole reason the two release
# tools can share a repository.

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/cli/**'
      - 'packages/mcp/**'
      - '.github/workflows/publish-tools.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  # Never two release runs against main at once: the second would compute its
  # versions from a tree the first has already moved.
  group: publish-tools
  cancel-in-progress: false

jobs:
  # The workspace links the local engine, so the build and the tests pass
  # against exports npm may not have yet. A user's install resolves the range
  # in packages/{cli,mcp}/package.json instead: fail here if any engine export
  # the built tools import is missing from that engine (spec 078 review round 1
  # item 1). The check installs and imports a package from npm, so it runs in
  # a job of its own with a read-only token and no OIDC identity, and the
  # release job waits for it (spec 085 R2-1): code a registry serves never runs
  # where the release credentials are.
  engine-exports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No npm cache: this job runs registry code, and a cache it saved
          # could be restored where the release credentials are.

      - name: Update npm
        run: npm install -g npm@12.2.1

      - run: npm ci

      - run: npm run build:packages

      # The runner's cache tokens unset, so the imported code cannot save a
      # cache of its own either.
      - name: Every engine export the tools import is in the engine their range resolves to
        run: env -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL node scripts/check-engine-exports.mjs

  release:
    needs: engine-exports
    runs-on: ubuntu-latest
    # Same manual gate as the engine: an automated version bump still has to be
    # a human decision to ship.
    environment: release
    permissions:
      contents: write # tags, and the version commit on the release PR branch
      pull-requests: write # opens and updates the Version Packages PR
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 24, not the engine workflow's 22. Both tools declare `engines: >=24` and
      # use Node APIs that floor there, so publishing from 22 would be testing a
      # runtime neither package claims to support.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # No npm cache (spec 085 R2-1 review): a cache is shared across jobs,
          # and one written after registry code ran must never reach this job.

      # OIDC trusted publishing needs a recent npm CLI. Pinned to a major for
      # the same reason publish-engine.yml pins it: a release pipeline should not
      # adopt breaking CLI changes on the day they ship.
      - name: Update npm
        run: npm install -g npm@12.2.1

      - run: npm ci

      # Each package's own `prepublishOnly` re-runs clean + typecheck + test +
      # build immediately before its tarball is made, so this is not the only
      # thing standing between a broken tree and the registry. It is the thing
      # that makes a broken tree fail HERE, in a step named after what broke,
      # rather than inside `changeset publish` after the first package is
      # already up.
      # The engine is released by semantic-release, not by Changesets — but it
      # is no longer in .changeset/config.json `ignore`, because Changesets
      # rejects a config that skips a package while a non-skipped one depends on
      # it, and @veilio-inc/cli does. So Changesets can see the engine, and what
      # keeps it from publishing one is arithmetic rather than configuration:
      # `changeset publish` uploads a package only when its manifest version is
      # not already on the registry.
      #
      # That is true today and stays true only while the manifest tracks npm.
      # Let it lead — a hand-edit to 1.4.0 before semantic-release has cut
      # 1.4.0 — and this workflow would publish an engine from the working tree,
      # with no engine-v tag, no CHANGELOG entry, and no release behind it.
      # ci.yml already asserts this on main; asserted again here because that is
      # a different workflow and this is the one holding the credential.
      - name: Engine manifest matches the registry, or nothing publishes
        run: |
          set -uo pipefail
          LOCAL=$(node -p "require('./packages/engine/package.json').version")
          if ! PUBLISHED=$(npm view @veilio-inc/engine version 2>/dev/null) || [ -z "${PUBLISHED}" ]; then
            echo "::error::Cannot reach npm to confirm the engine version. Refusing to publish rather than assume."
            exit 1
          fi
          if [ "${PUBLISHED}" != "${LOCAL}" ]; then
            echo "::error::packages/engine/package.json is ${LOCAL} but npm has ${PUBLISHED}."
            echo "Publishing now risks changeset publish uploading an engine semantic-release never cut."
            exit 1
          fi
          echo "engine ${LOCAL} matches the registry; changeset publish will skip it."

      - name: Build, typecheck and test the packages
        run: |
          npm run build:packages
          npm run typecheck --workspaces --if-present
          npm run test --workspaces --if-present

      # Fail, not warn, if either tarball would ship something outside the
      # allowlist — the same check publish-engine.yml runs, for the same reason:
      # the file list does not depend on the version, so it can be verified
      # before anything is versioned.
      - name: Verify tarballs contain only allowlisted files
        run: |
          for pkg in cli mcp; do
            ( cd "packages/$pkg" && npm pack --dry-run --json | node -e '
              const allowed = /^dist\//
              const named = /^(README\.md|LICENSE|CHANGELOG\.md|package\.json)$/
              const raw = JSON.parse(require("fs").readFileSync(0, "utf8"))
              const [pkg] = Array.isArray(raw) ? raw : Object.values(raw)
              if (!pkg || !Array.isArray(pkg.files)) {
                console.error("Unrecognised `npm pack --json` output; refusing to publish unchecked.")
                process.exit(1)
              }
              const bad = pkg.files.map(f => f.path).filter(p => !allowed.test(p) && !named.test(p))
              if (bad.length) {
                console.error(`Unexpected files in ${pkg.name}:`, bad)
                process.exit(1)
              }
              // An empty dist is the failure this repo has already had once: the
              // manifest ships `dist`, the directory is gitignored, and nothing
              // built it. The tarball uploads fine and the binary is missing.
              if (!pkg.files.some(f => allowed.test(f.path))) {
                console.error(`${pkg.name} would ship no dist/ at all.`)
                process.exit(1)
              }
              console.log(`${pkg.name} OK — ${pkg.files.length} allowlisted files.`)
            ' )
          done

      # Every input below is the v2 spelling, matching the pinned v2.1.2 above.
      #
      # They were the v1 spellings - version, publish, title, commit - against a
      # v2 action, which is a silent failure rather than a loud one: an input v2
      # does not recognise only warns, so `publish` fell back to its default and
      # this step would have versioned and published nothing while reporting
      # success. It is only reachable on a push to main behind a paths filter,
      # so no pull request could ever have exercised it.
      #
      # The other half of the same mismatch was @changesets/cli: v2 here, while
      # changesets/action v2 refuses to run against anything below CLI v3. The
      # dependency bump in this change takes the CLI to 3.0.3, which is what
      # makes the pinned action legal at all. release-config.test.ts now fails
      # whenever the two majors disagree in either direction.
      - name: Version PR, or publish a merged one
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: 'chore: version the CLI and MCP server'
          commit-message: 'chore: version the CLI and MCP server'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Publishing is OIDC trusted publishing only, with no npm token. A new
          # package's first publish is done by hand: see .changeset/README.md.
