name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the tree. Without this the job runs with whatever the repository
# default grants, which on many repos is a writable token — handed to a workflow
# that builds and tests pull-request code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jsdom 30 (devDependency, used by the cross-realm crypto tests) requires
      # ^22.22.2 || ^24.15.0 || >=26, and its undici 8 requires >=22.19. Node 20
      # is also past end-of-life, so CI was testing an unsupported runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      # The three packages under packages/ each own a vitest config and are run
      # by their own scripts, not by the root vitest above — which excludes
      # packages/** precisely so a package is tested against the config it was
      # written against.
      #
      # Built first, and in dependency order, because two of them are consumed
      # as build output rather than as source: the app imports the engine's
      # dist, and packages/mcp imports `@veilio-inc/cli/store`, which resolves
      # through the CLI's exports map into packages/cli/dist. `npm ci` builds
      # only the engine (see the root postinstall), so without this step the MCP
      # typecheck fails on a module that genuinely exists.
      - name: Build packages
        run: npm run build:packages

      # The blind spot in tests/package-graph.test.ts, covered here because it
      # needs the registry and that suite must never touch the network.
      #
      # That test asserts the CLI and MCP ranges track packages/engine/package.json.
      # But since @semantic-release/git was removed, npm is the authority on the
      # engine's version and that manifest is a hand-maintained copy of it. Forget
      # to sync it after a release and the local check compares two stale numbers
      # and agrees with itself, which is the one failure it cannot see from inside
      # the tree.
      #
      # Fails on main, warns on a pull request. The drift appears the moment
      # semantic-release publishes, which is a push to main — and at that instant
      # every open PR would start failing on something its author did not cause
      # and mostly cannot fix. A red build that is somebody else's fault is one
      # people learn to ignore, and it would take the checks that ARE their fault
      # down with it. On main it is nobody else's fault, so there it fails.
      #
      # Skips loudly when npm cannot be reached either way. A registry outage
      # should not block every merge, and unlike the billing preflights this
      # guards a stale version range rather than money quietly not collected.
      - name: Engine version matches what is published
        run: |
          set -uo pipefail
          LOCAL=$(node -p "require('./packages/engine/package.json').version")
          if ! PUBLISHED=$(npm view @veilio-inc/engine version 2>/dev/null) || [ -z "${PUBLISHED}" ]; then
            echo "::warning::Could not read @veilio-inc/engine from npm; skipping the sync check. Local manifest says ${LOCAL}."
            exit 0
          fi
          echo "npm: ${PUBLISHED}   packages/engine/package.json: ${LOCAL}"
          if [ "${PUBLISHED}" = "${LOCAL}" ]; then exit 0; fi

          echo "packages/engine/package.json says ${LOCAL} but npm has ${PUBLISHED}."
          echo "semantic-release writes the version into the tarball at publish time and no"
          echo "longer commits it back, so this field only moves when a person moves it. While"
          echo "it is stale, the range check in tests/package-graph.test.ts compares two old"
          echo "numbers and passes. Set the version to ${PUBLISHED} and widen the"
          echo "@veilio-inc/engine range in packages/cli and packages/mcp in the same commit."

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "::warning::Engine version is out of sync (npm ${PUBLISHED}, repo ${LOCAL}). This predates your branch — not failing your PR."
            exit 0
          fi
          echo "::error::Engine version is out of sync: npm has ${PUBLISHED}, this repo says ${LOCAL}."
          exit 1

      - name: Typecheck packages
        run: npm run typecheck --workspaces --if-present

      - name: Test packages
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build
        env:
          VITE_VEILIO_CLOUD_URL: https://veilio.dev

      # The e2e suite is the only thing here that exercises a real browser, and
      # it holds the assertions this project exists for: that a full page load
      # contacts nothing off-origin, and that no request carries the user's
      # source. jsdom cannot check either. Until now it gated nothing — it ran
      # only when someone remembered, which for a privacy guarantee is the same
      # as not running.
      #
      # Steps rather than a second job: this repository is public so the minutes
      # are free, but a separate job would repeat checkout, setup-node and
      # `npm ci` to save nothing, and the build above is exactly what Playwright
      # previews.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the resolved Playwright version: the browser build is a
          # property of that release, so an unrelated dependency bump should not
          # discard a 170 MiB download.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Binaries live in the cache; the OS libraries they link against are
      # installed into the runner image by apt, so this runs either way.
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
