name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the tree. Without this the job runs with whatever the repository
# default grants, which on many repos is a writable token — handed to a workflow
# that builds and tests pull-request code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jsdom 30 (devDependency, used by the cross-realm crypto tests) requires
      # ^22.22.2 || ^24.15.0 || >=26, and its undici 8 requires >=22.19. Node 20
      # is also past end-of-life, so CI was testing an unsupported runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_VEILIO_CLOUD_URL: https://veilio.dev
