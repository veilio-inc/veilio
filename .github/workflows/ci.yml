name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # jsdom 30 (devDependency, used by the cross-realm crypto tests) requires
      # ^22.22.2 || ^24.15.0 || >=26, and its undici 8 requires >=22.19. Node 20
      # is also past end-of-life, so CI was testing an unsupported runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_Veilio_CLOUD_URL: https://veilio.dev
