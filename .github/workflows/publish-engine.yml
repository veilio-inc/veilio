name: Publish @veilio-inc/engine

# semantic-release owns the version. It reads the conventional-commit history
# since the last `engine-v*` tag, decides the bump, writes the CHANGELOG, tags,
# publishes to npm with provenance, and opens the GitHub Release.
#
# It does NOT write back to `main`. The version and changelog it generates are
# packed into the npm tarball from the runner's working copy; the committed
# copies in this repository stay where the last merge left them. That is what
# lets `main` require a reviewed pull request with no bypass for this workflow.
#
# Publishing still uses npm OIDC "trusted publishing" — no long-lived NPM_TOKEN
# is stored. The `release` environment gates the job behind manual approval, so
# an automated version bump is still a human decision to ship.
#
# `paths` keeps app-only changes from triggering this workflow at all. Once it
# does run, commit analysis still covers every commit since the last engine tag
# — but both the bump and the changelog are now scoped to `(engine)` commits in
# `.releaserc.js`, so an unrelated `feat(ui)` landing in between neither inflates
# the version nor appears in the engine's changelog. When the CLI and MCP
# packages land (ROADMAP C1, C2), each takes its own scope and its own workflow.

on:
  push:
    branches: [main]
    paths:
      - 'packages/engine/**'
      - '.releaserc.js'
      - '.github/workflows/publish-engine.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the git tag and the GitHub Release; no branch push
      issues: write
      pull-requests: write
      id-token: write # OIDC trusted publishing + provenance
    steps:
      # Full history so semantic-release can read every commit since the last
      # tag. Credentials are still persisted: the tag is pushed, the branch is
      # not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      # Kept at 22 while the app CI runs 24: the engine declares engines
      # ">=20" and has zero runtime dependencies, so publishing from the
      # lowest realistic runtime is the closer test of that claim.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires a recent npm CLI. Pinned to a major
      # rather than `latest`: npm 12 changed the shape of `npm pack --json` from
      # an array to an object, which silently broke the tarball allowlist check
      # below. A release pipeline should not adopt breaking CLI changes the day
      # they ship.
      - name: Update npm
        run: npm install -g npm@12

      # Root install also builds the engine via the postinstall script.
      - name: Install (pinned, deterministic)
        run: npm ci

      - name: Test (incl. purity/privacy gate)
        run: npm test --prefix packages/engine

      - name: Typecheck
        run: npm run typecheck --prefix packages/engine

      # Fail (not just print) if anything beyond the allowlist would ship. Runs
      # before semantic-release so a bad tarball never reaches a published
      # version — the file list does not depend on the version number.
      - name: Verify tarball contains only allowlisted files
        working-directory: packages/engine
        run: |
          npm pack --dry-run --json | node -e '
            const allowed = /^(dist\/|src\/)|^(README\.md|LICENSE|CHANGELOG\.md|package\.json)$/
            // npm 11 emits an array of packages; npm 12 emits an object keyed by
            // package name. The inner shape is identical, so normalise the wrapper
            // rather than pinning this check to one CLI major.
            const raw = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const [pkg] = Array.isArray(raw) ? raw : Object.values(raw)
            if (!pkg || !Array.isArray(pkg.files)) {
              console.error("Unrecognised `npm pack --json` output; refusing to publish unchecked.")
              process.exit(1)
            }
            const bad = pkg.files.map(f => f.path).filter(p => !allowed.test(p))
            if (bad.length) {
              console.error("Unexpected files in tarball:", bad)
              process.exit(1)
            }
            console.log(`Tarball OK — ${pkg.files.length} allowlisted files.`)
          '

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
