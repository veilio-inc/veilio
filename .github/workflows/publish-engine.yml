name: Publish @dlgshi/engine

# Publishes the engine package to npm with build provenance, using npm OIDC
# "trusted publishing" — no long-lived NPM_TOKEN is stored (plan controls
# S2/S3/S4). Triggered only by an `engine-v*` tag push or a manual dispatch,
# never by a (fork) pull_request, so secrets/identity are never exposed to
# untrusted PR code. The `release` environment should require manual approval.

on:
  push:
    tags:
      - 'engine-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires a recent npm CLI.
      - name: Update npm
        run: npm install -g npm@latest
        working-directory: .

      # Releases must be tag-anchored and the tag must equal package.json's
      # version, so every published artifact is traceable to one engine-v* tag.
      # workflow_dispatch stays usable for retries — run it on the tag ref.
      - name: Verify ref is an engine-v* tag matching package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Refusing to publish from a non-tag ref ($GITHUB_REF_TYPE $GITHUB_REF_NAME). Run this workflow on an engine-v* tag." >&2
            exit 1
          fi
          case "$GITHUB_REF_NAME" in engine-v*) ;; *)
            echo "Tag '$GITHUB_REF_NAME' does not match engine-v*." >&2
            exit 1
          ;; esac
          TAG_VERSION="${GITHUB_REF_NAME#engine-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Install (pinned, deterministic)
        run: npm ci

      - name: Test (incl. purity/privacy gate)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fail (not just print) if anything beyond the allowlist would ship.
      - name: Verify tarball contains only allowlisted files
        run: |
          npm pack --dry-run --json | node -e '
            const allowed = /^(dist\/|src\/)|^(README\.md|LICENSE|CHANGELOG\.md|package\.json)$/
            const [pkg] = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const bad = pkg.files.map(f => f.path).filter(p => !allowed.test(p))
            if (bad.length) {
              console.error("Unexpected files in tarball:", bad)
              process.exit(1)
            }
          '

      - name: Publish with provenance
        run: npm publish --provenance --access public
